    static_configs:
      - targets: ["feed-api:8005"]
  - job_name: dashboard-api
    static_configs:
      - targets: ["dashboard-api:8006"]
  - job_name: ingest-service
    static_configs:
      - targets: ["ingest-service:8001"]
