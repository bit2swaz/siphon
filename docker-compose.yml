networks:
  siphon-net:
    driver: bridge

volumes:
  qdrant_data:
  minio_data:
  postgres_data:

services:
  kafka:
    image: confluentinc/cp-kafka:8.3.0
    hostname: kafka
    networks: [siphon-net]
    ports: ["9092:9092", "9093:9093"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 8

  qdrant:
    image: qdrant/qdrant:latest
    networks: [siphon-net]
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp6 | grep -q '18BD' || cat /proc/net/tcp | grep -q '18BD'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks: [siphon-net]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    networks: [siphon-net]
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    networks: [siphon-net]
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siphon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siphon}
      POSTGRES_DB: ${POSTGRES_DB:-siphon}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siphon"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingest-service:
    build:
      context: .
      dockerfile: ingest-service/Dockerfile
    networks: [siphon-net]
    ports: ["8001:8001"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-siphon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siphon}
      POSTGRES_DB: ${POSTGRES_DB:-siphon}
      WHISPER_MODEL: base
      CLIP_MODEL: ViT-B/32
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  feature-service:
    build:
      context: .
      dockerfile: feature-service/Dockerfile
    networks: [siphon-net]
    depends_on:
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      MINIO_HOST: minio:9000
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-siphon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siphon}
      POSTGRES_DB: ${POSTGRES_DB:-siphon}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  user-event-service:
    build:
      context: .
      dockerfile: user-event-service/Dockerfile
    networks: [siphon-net]
    ports: ["8002:8002"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "8002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    networks: [siphon-net]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    networks: [siphon-net]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
